pipeline_name: jdbc-orders-bronze
connector_type: jdbc

connector:
  adapter: postgresql
  host: "sample-db-host"
  port: 5432
  database: "sample-database"
  user: "sample-user"
  password: "sample-password"
  table: "orders"
  columns: ["order_id", "customer_id", "amount", "created_at"]
  watermark_column: "created_at"
  watermark_value: "2024-01-01T00:00:00"
  fetch_size: 10000

azure:
  account_name: "sample-storage-account"
  auth_method: "account_key"
  account_key: "sample-account-key"

sink:
  delta_table_uri: "abfss://datalake@sample-storage-account.dfs.core.windows.net/bronze/orders"
  write_mode: "append"

schema:
  - name: "order_id"
    type: "string"
  - name: "customer_id"
    type: "string"
  - name: "amount"
    type: "float64"
  - name: "created_at"
    type: "timestamp"
